<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבצע לוחות תפילה דגם "אגם" 70/100 ס"מ | אור-אל</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-light:#e8c97a;--dark:#0d0d0d;--dark2:#161616;--dark3:#1e1e1e;--white:#f5f0e8;--orange:#e07b2a;--text:#d4c5a0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--white);font-family:'Heebo',sans-serif;direction:rtl;}
header{background:linear-gradient(180deg,#000,#0d0d0d);border-bottom:1px solid var(--gold);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo-name{font-size:26px;font-weight:900;color:var(--gold);}
.logo-sub{font-size:11px;color:var(--text);font-weight:300;}
.header-cta{background:var(--orange);color:#fff;padding:10px 22px;border-radius:6px;font-weight:700;font-size:14px;text-decoration:none;display:flex;align-items:center;gap:8px;}
.hero{background:linear-gradient(135deg,#0a0a0a,#1a1208,#0a0a0a);padding:70px 32px 60px;text-align:center;border-bottom:1px solid rgba(201,168,76,0.3);position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,0.08),transparent 70%);}
.hero-badge{display:inline-block;background:rgba(224,123,42,0.15);border:1px solid var(--orange);color:var(--orange);padding:5px 18px;border-radius:20px;font-size:13px;font-weight:700;margin-bottom:24px;}
.ornament{color:var(--gold);font-size:18px;letter-spacing:6px;margin-bottom:16px;opacity:0.7;}
.hero h1{font-size:clamp(32px,6vw,62px);font-weight:900;color:var(--gold);line-height:1.15;margin-bottom:8px;}
.hero-model{font-size:clamp(16px,3vw,24px);color:var(--text);font-weight:300;margin-bottom:28px;}
.price-tag{display:inline-block;background:linear-gradient(135deg,#1e1500,#2e2000);border:2px solid var(--gold);border-radius:12px;padding:18px 36px;margin-bottom:32px;}
.price-label{font-size:12px;color:var(--text);margin-bottom:4px;}
.price-amount{font-size:48px;font-weight:900;color:var(--gold-light);line-height:1;}
.price-note{font-size:12px;color:var(--text);margin-top:4px;}
.hero-features{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;margin-bottom:40px;}
.feature-item{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:90px;}
.feature-icon{width:52px;height:52px;border:1.5px solid rgba(201,168,76,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(201,168,76,0.06);}
.feature-label{font-size:12px;color:var(--text);text-align:center;line-height:1.4;}
.hero-ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn-primary{background:var(--orange);color:#fff;padding:14px 32px;border-radius:8px;font-weight:700;font-size:16px;text-decoration:none;display:flex;align-items:center;gap:10px;}
.btn-secondary{border:1.5px solid var(--gold);color:var(--gold);padding:14px 32px;border-radius:8px;font-weight:600;font-size:15px;text-decoration:none;background:transparent;}
.section-header{text-align:center;padding:60px 32px 36px;}
.section-ornament{color:var(--gold);font-size:14px;letter-spacing:8px;opacity:0.6;margin-bottom:12px;}
.section-title{font-size:clamp(24px,4vw,38px);font-weight:900;color:var(--gold);margin-bottom:10px;}
.section-sub{font-size:15px;color:var(--text);font-weight:300;max-width:500px;margin:0 auto;line-height:1.6;}
.divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto 0;}
.gallery-section{padding:0 24px 60px;}
.gallery-category{margin-bottom:56px;}
.category-title{font-size:20px;font-weight:700;color:var(--gold);border-right:3px solid var(--gold);padding-right:14px;margin-bottom:20px;margin-right:8px;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.gallery-card{background:var(--dark2);border:1px solid rgba(201,168,76,0.2);border-radius:10px;overflow:hidden;transition:border-color 0.2s,transform 0.2s;}
.gallery-card:hover{border-color:var(--gold);transform:translateY(-3px);}
.gallery-card{position:relative;}.gallery-card img{width:100%;height:280px;object-fit:contain;display:block;background:#111;cursor:pointer;}
.enlarge-btn{position:absolute;bottom:8px;left:8px;background:rgba(201,168,76,0.85);color:#000;border:none;border-radius:6px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Heebo',sans-serif;opacity:0;transition:opacity 0.2s;}
.gallery-card:hover .enlarge-btn{opacity:1;}
#lightbox{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.92);align-items:center;justify-content:center;}
#lightbox.open{display:flex;}
#lightbox img{max-width:90vw;max-height:88vh;object-fit:contain;border:2px solid rgba(201,168,76,0.4);border-radius:4px;}
#lb-close{position:fixed;top:18px;left:20px;background:none;border:none;color:#c9a84c;font-size:32px;cursor:pointer;z-index:2001;line-height:1;}
#lb-prev,#lb-next{position:fixed;top:50%;transform:translateY(-50%);background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.4);color:#c9a84c;font-size:28px;cursor:pointer;padding:12px 16px;border-radius:8px;z-index:2001;}
#lb-prev{right:10px;}#lb-next{left:10px;}
.specs-section{background:var(--dark2);border-top:1px solid rgba(201,168,76,0.2);border-bottom:1px solid rgba(201,168,76,0.2);padding:60px 32px;}
.specs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;max-width:900px;margin:0 auto;}
.spec-item{display:flex;align-items:flex-start;gap:14px;padding:20px;background:var(--dark3);border-radius:10px;border:1px solid rgba(201,168,76,0.15);}
.spec-icon{font-size:26px;min-width:36px;text-align:center;}
.spec-text h4{font-size:14px;color:var(--gold);font-weight:700;margin-bottom:4px;}
.spec-text p{font-size:13px;color:var(--text);line-height:1.5;}
.cta-section{background:linear-gradient(135deg,#0f0b00,#1a1200,#0f0b00);border-top:1px solid rgba(201,168,76,0.3);border-bottom:1px solid rgba(201,168,76,0.3);padding:60px 32px;text-align:center;}
.cta-section h2{font-size:clamp(22px,4vw,36px);font-weight:900;color:var(--gold);margin-bottom:12px;}
.cta-section p{color:var(--text);font-size:16px;margin-bottom:32px;line-height:1.6;}
.cta-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
footer{background:#000;border-top:1px solid rgba(201,168,76,0.3);padding:40px 32px 24px;}
.footer-icons{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;margin-bottom:32px;}
.footer-item{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--text);}
.footer-icon-circle{width:48px;height:48px;border:1.5px solid rgba(201,168,76,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;}
.footer-item span{font-size:12px;text-align:center;}
.footer-contacts{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;padding-top:24px;border-top:1px solid rgba(201,168,76,0.15);margin-bottom:20px;}
.contact-link{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-size:14px;}
.contact-link:hover{color:var(--gold);}
.footer-bottom{text-align:center;font-size:12px;color:rgba(180,160,120,0.4);padding-top:16px;}
@media(max-width:600px){header{padding:12px 16px;}.hero{padding:50px 16px 40px;}.gallery-section{padding:0 12px 40px;}.gallery-grid{grid-template-columns:repeat(2,1fr);gap:10px;}.gallery-card img{height:180px;}.footer-icons{gap:20px;}}
#whatsapp-float{position:fixed;bottom:24px;left:24px;z-index:999;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.4);cursor:pointer;text-decoration:none;transition:transform 0.2s;}
#whatsapp-float:hover{transform:scale(1.1);}
#accessibility-btn{position:fixed;bottom:90px;left:24px;z-index:999;width:44px;height:44px;border-radius:50%;background:#1565C0;border:none;cursor
